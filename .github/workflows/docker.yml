name: Docker image

# Started by hand only: Actions -> Docker image -> Run workflow, on the chosen branch.
# The image goes to ghcr.io/<owner>/x-proxy-router (docker/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The architectures of build.json (scripts/build-config.mjs).
      - id: build
        run: node scripts/build-config.mjs github >> "$GITHUB_OUTPUT"

      # The arm64 image runs its build steps under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest only from the default branch; every build also gets the branch
      # name and sha-<commit>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.build.outputs.docker_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
