# Linux host networking preserves configurable TCP/UDP inbound ports.
name: x-proxy-router

services:
  x-proxy-router:
    image: ghcr.io/s-vin/x-proxy-router:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      # Deliberately not configurable: no public unauthenticated panel port.
      XPR_UI_HOST: 127.0.0.1
      XPR_UI_PORT: 20800
      XPR_PUBLIC_ORIGIN: https://${XPR_PANEL_DOMAIN:?Set XPR_PANEL_DOMAIN}:8443
      XPR_DATA_DIR: /data
    volumes:
      - ${XPR_DATA_DIR:?Set XPR_DATA_DIR}:/data:Z
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    restart: unless-stopped
    network_mode: host
    environment:
      TINYAUTH_APPURL: https://${XPR_AUTH_DOMAIN:?Set XPR_AUTH_DOMAIN}:8443
      TINYAUTH_SERVER_ADDRESS: 127.0.0.1
      TINYAUTH_SERVER_PORT: 20801
      TINYAUTH_AUTH_USERS: ${TINYAUTH_USERS:?Set TINYAUTH_USERS to a bcrypt user entry}
      TINYAUTH_AUTH_SECURECOOKIE: "true"
      TINYAUTH_AUTH_TRUSTEDPROXIES: 127.0.0.1/32
    volumes:
      - tinyauth-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - x-proxy-router
      - tinyauth
    environment:
      XPR_PANEL_DOMAIN: ${XPR_PANEL_DOMAIN}
      XPR_AUTH_DOMAIN: ${XPR_AUTH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tinyauth-data:
  caddy-data:
  caddy-config:
