[project]
name = "x-proxy-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14,<4",
    "aiohttp-socks>=0.12,<1",
    "apscheduler>=3.11.3,<4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["server", "scripts"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
