# Packages of the desktop application; the "Desktop application" workflow runs
# electron-builder on a computer of each OS and architecture (README.md).
appId: io.github.s_vin.x_proxy_router
productName: X Proxy Router
copyright: Copyright © 2026 S-VIN

directories:
  output: release
  buildResources: build

# dist: the bundled main process and the icons it loads (npm run build, npm run icons).
files:
  - dist/main.cjs
  - dist/assets/**
  - package.json
asar: true

# The server with its Python and the core of the target platform
# (scripts/prepare-backend.py): process.resourcesPath/backend.
extraResources:
  - from: build/backend/${os}-${arch}
    to: backend

win:
  target:
    - nsis
    - portable
  icon: build/icon.png

# No questions: installs for the current user, without administrator rights.
nsis:
  oneClick: true
  perMachine: false
  # Uninstalling removes the settings and the autostart entry (installer.nsh).
  deleteAppDataOnUninstall: true
  include: installer.nsh
  artifactName: x-proxy-router-${version}-windows-${arch}-setup.${ext}

# One exe that runs without installation and keeps its data next to itself.
portable:
  artifactName: x-proxy-router-${version}-windows-${arch}-portable.${ext}

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.utilities
  # No certificate of Apple: an ad-hoc signature, without which a Mac with Apple silicon
  # does not run the code at all. A downloaded application still has to be allowed by
  # the user (README.md).
  identity: '-'
  # Serves notarization; with an ad-hoc signature it stops Electron and Python from
  # loading their libraries.
  hardenedRuntime: false
  # Of the server only the executable files are signed: Python, its extension modules
  # and the core. The rest, thousands of files, is covered by the signature of the
  # application like any resource.
  signIgnore:
    - '/Contents/Resources/backend/(?!.*(\.so|\.dylib|/bin/python[^/]*|/mihomo)$)'

# The application to drag into Applications.
dmg:
  artifactName: x-proxy-router-${version}-macos-${arch}.${ext}
  # No updates: no file that describes the image for them.
  writeUpdateInfo: false

linux:
  target:
    - AppImage
    - flatpak
    - pacman
  executableName: x-proxy-router
  # The desktop entry is named after desktopName of package.json, which Electron uses
  # as the window's application id: the desktop then shows the icon of the entry.
  syncDesktopName: true
  icon: build/icons
  category: Network
  synopsis: Runs and configures the Mihomo core
  artifactName: x-proxy-router-${version}-linux-${arch}.${ext}

flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '25.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '25.08'
  finishArgs:
    # The window.
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
    # The inbounds listen on the ports of the computer, the core connects to the servers.
    - --share=network
    # The tray icon.
    - --talk-name=org.kde.StatusNotifierWatcher
    # "Launch at login" writes a desktop entry there (src/autostart.ts).
    - --filesystem=xdg-config/autostart:create

# The package of Arch Linux and the distributions based on it: pacman -U installs it in
# /opt with a command and a menu entry, and the libraries it needs.
pacman:
  artifactName: x-proxy-router-${version}-linux-${arch}.pkg.tar.zst
  compression: zstd
  # The packager field of the package; electron-builder takes it from an author's email.
  maintainer: S-VIN
  # No updates: pacman updates the package; no file that describes it for them.
  publish: null
  # The packages of the libraries that Electron is linked with (those of electron-builder
  # are of an older Electron and some are gone from Arch); the server's Python and the
  # core bring their own.
  depends:
    - gtk3
    - nss
    - alsa-lib
    - at-spi2-core
    - libcups
    - libxkbcommon
    - mesa
    # Links of the interface and "Show log" open through it.
    - xdg-utils
